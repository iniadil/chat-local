[package]
name = "chatlocal"
version = "0.1.0"
description = "Chat over your local network: text, voice notes, images and documents. No internet, no accounts."
authors = ["ChatLocal contributors"]
edition = "2021"
license = "MIT"
repository = "https://github.com/iniadil/chat-local"

[lib]
name = "chatlocal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lanchat-net = { path = "../crates/lanchat-net" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
