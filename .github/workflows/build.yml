name: Build installers

# Builds Windows (.msi, .exe) and macOS (.dmg) installers.
# - On every push to main / pull request: build only, artifacts attached to the run.
# - On a tag like v0.1.0: build and publish a GitHub Release with the installers.
# Uses the official tauri-action: https://github.com/tauri-apps/tauri-action

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-core:
    name: Test networking core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lanchat-net

  build:
    name: ${{ matrix.name }}
    needs: test-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          # Only publish a release when the push is a version tag.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('ChatLocal {0}', github.ref_name) || '' }}
          releaseBody: "Installers for Windows and macOS. See README for install notes (unsigned builds)."
          releaseDraft: true
          prerelease: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}-${{ strategy.job-index }}
          path: |
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
