name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: ChatLocal version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10
        - Windows 11
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (built from source)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: Network setup (for discovery or connection problems)
      description: Same Wi-Fi or wired network? Manual addresses? Server mode? Firewall prompts accepted?
