<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatLocal</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <aside class="sidebar">
        <header class="sidebar-head">
          <div class="me">
            <div class="avatar avatar-me" id="me-avatar"></div>
            <div class="me-text">
              <div class="me-name" id="me-name"></div>
              <div class="me-status" id="me-status"></div>
            </div>
          </div>
          <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1l-.4-2.7h-4l-.4 2.7a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.8 1.7 1l.4 2.7h4l.4-2.7c.6-.2 1.2-.6 1.7-1l2.5 1 2-3.5L19.4 13ZM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
          </button>
        </header>
        <nav class="conv-list" id="conv-list"></nav>
        <footer class="sidebar-foot">
          <div class="addr" id="my-addr"></div>
          <button class="text-btn" id="btn-add-peer" data-i18n="addComputer"></button>
        </footer>
      </aside>

      <main class="chat">
        <header class="chat-head">
          <div class="chat-title">
            <div class="chat-name" id="chat-name"></div>
            <div class="chat-sub" id="chat-sub"></div>
          </div>
        </header>
        <section class="messages" id="messages"></section>
        <div class="composer" id="composer">
          <div class="recording" id="recording" hidden>
            <span class="rec-dot"></span>
            <span class="rec-time" id="rec-time">0:00</span>
            <span class="rec-hint" data-i18n="recordingHint"></span>
            <span class="spacer"></span>
            <button class="text-btn" id="btn-rec-cancel" data-i18n="cancel"></button>
            <button class="primary-btn" id="btn-rec-send" data-i18n="send"></button>
          </div>
          <div class="transfers" id="transfers" hidden></div>
          <div class="pending" id="pending" hidden>
            <div class="pending-list" id="pending-list"></div>
            <div class="pending-foot">
              <span class="pending-hint" id="pending-hint"></span>
              <span class="spacer"></span>
              <button class="text-btn" id="btn-pending-clear" data-i18n="clearAttachments"></button>
            </div>
          </div>
          <div class="composer-row" id="composer-row">
            <button class="icon-btn" id="btn-attach" title="Attach" aria-label="Attach file">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="m16.5 6.5-7.8 7.8a2.2 2.2 0 0 0 3.1 3.1l8.2-8.2a4.2 4.2 0 0 0-6-6L5.8 11.4a6.2 6.2 0 0 0 8.8 8.8l6.4-6.4"/></svg>
            </button>
            <textarea id="input" rows="1" autocomplete="off" spellcheck="true"></textarea>
            <button class="icon-btn" id="btn-mic" title="Voice note" aria-label="Record voice note">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15a4 4 0 0 0 4-4V6a4 4 0 0 0-8 0v5a4 4 0 0 0 4 4Zm6-4a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.9V22h2v-3.1A8 8 0 0 0 20 11h-2Z"/></svg>
            </button>
            <button class="icon-btn send" id="btn-send" title="Send" aria-label="Send">
              <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 11.5 21 3l-8.5 18-1.8-7.7L3 11.5Z"/></svg>
            </button>
          </div>
        </div>
        <div class="drop-overlay" id="drop-overlay" hidden><span data-i18n="dropHere"></span></div>
      </main>
    </div>

    <div class="modal" id="settings-modal" hidden>
      <div class="modal-card">
        <header class="modal-head">
          <h2 data-i18n="settings"></h2>
          <button class="icon-btn" id="btn-settings-close" aria-label="Close">✕</button>
        </header>
        <form id="settings-form" class="form">
          <label>
            <span data-i18n="displayName"></span>
            <input name="display_name" maxlength="48" />
          </label>
          <label>
            <span data-i18n="language"></span>
            <select name="lang">
              <option value="id">Bahasa Indonesia</option>
              <option value="en">English</option>
            </select>
          </label>
          <fieldset>
            <legend data-i18n="network"></legend>
            <label class="row">
              <input type="checkbox" name="discovery" />
              <span>
                <b data-i18n="discovery"></b>
                <small data-i18n="discoveryHelp"></small>
              </span>
            </label>
            <label>
              <span data-i18n="port"></span>
              <input name="port" type="number" min="1" max="65535" />
            </label>
            <label>
              <span data-i18n="manualPeers"></span>
              <textarea name="manual_peers" rows="3" placeholder="192.168.1.20&#10;192.168.1.21:47800&#10;pc-dapur.local"></textarea>
              <small data-i18n="manualPeersHelp"></small>
            </label>
          </fieldset>
          <fieldset>
            <legend data-i18n="voiceNotes"></legend>
            <label>
              <span data-i18n="microphone"></span>
              <select name="mic" id="mic-select"></select>
              <small data-i18n="microphoneHelp"></small>
            </label>
          </fieldset>
          <fieldset>
            <legend data-i18n="serverMode"></legend>
            <label class="row">
              <input type="checkbox" name="relay" />
              <span>
                <b data-i18n="relay"></b>
                <small data-i18n="relayHelp"></small>
              </span>
            </label>
          </fieldset>
          <div class="form-info">
            <div><span data-i18n="yourAddresses"></span>: <code id="settings-addrs"></code></div>
            <div><span data-i18n="dataFolder"></span>: <code id="settings-datadir"></code></div>
          </div>
          <footer class="modal-foot">
            <button type="button" class="text-btn danger" id="btn-clear-history" data-i18n="clearHistory"></button>
            <span class="spacer"></span>
            <button type="submit" class="primary-btn" data-i18n="saveRestart"></button>
          </footer>
        </form>
      </div>
    </div>

    <div class="modal" id="peer-modal" hidden>
      <div class="modal-card small">
        <header class="modal-head">
          <h2 data-i18n="addComputer"></h2>
          <button class="icon-btn" id="btn-peer-close" aria-label="Close">✕</button>
        </header>
        <div class="form">
          <section class="found">
            <div class="found-head">
              <span class="found-title" data-i18n="foundTitle"></span>
              <span class="spacer"></span>
              <span class="found-status" id="found-status"></span>
              <button type="button" class="text-btn" id="btn-scan" data-i18n="scanAgain"></button>
            </div>
            <div class="found-list" id="found-list"></div>
            <small data-i18n="foundHelp"></small>
          </section>
          <label class="row">
            <input type="checkbox" id="peer-remember" checked />
            <span data-i18n="rememberPeer"></span>
          </label>
          <div class="or"><span data-i18n="orManual"></span></div>
          <form id="peer-form" class="manual">
            <label>
              <span data-i18n="peerAddress"></span>
              <div class="manual-row">
                <input name="target" placeholder="192.168.1.20 or 192.168.1.20:47800" required />
                <button type="submit" class="primary-btn" data-i18n="connect"></button>
              </div>
              <small data-i18n="peerAddressHelp"></small>
            </label>
          </form>
        </div>
      </div>
    </div>

    <div class="modal" id="welcome-modal" hidden>
      <div class="modal-card small">
        <form id="welcome-form" class="form welcome">
          <div class="welcome-mark">#</div>
          <h2 data-i18n="welcomeTitle"></h2>
          <p data-i18n="welcomeIntro"></p>
          <label>
            <span data-i18n="welcomeName"></span>
            <input name="display_name" maxlength="48" autocomplete="off" required />
            <small data-i18n="welcomeNameHelp"></small>
          </label>
          <footer class="modal-foot">
            <span class="spacer"></span>
            <button type="submit" class="primary-btn" data-i18n="welcomeStart"></button>
          </footer>
        </form>
      </div>
    </div>

    <div class="lightbox" id="lightbox" hidden>
      <img id="lightbox-img" alt="" />
      <div class="lightbox-bar">
        <button class="text-btn light" id="lightbox-open" data-i18n="openFile"></button>
        <button class="text-btn light" id="lightbox-close" data-i18n="close"></button>
      </div>
    </div>

    <div class="toasts" id="toasts"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
